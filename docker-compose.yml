services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-we_trust_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Если REDIS_PASSWORD пустой — запускаем без аутентификации
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ];
             then redis-server --requirepass $$REDIS_PASSWORD;
             else redis-server; fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      # Переопределяем хосты: внутри Docker сервисы доступны по имени контейнера,
      # а не localhost. Значения из .env (localhost) здесь не подходят.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      # Веса моделей хранятся на хосте — не теряются при пересборке образа.
      # После обучения вне Docker скопировать веса в ./ml/weights/
      - ./ml/weights:/app/ml/weights
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
